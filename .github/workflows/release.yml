name: Release draft
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing reviewed tag matching VERSION (for example v0.1.0)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  package:
    name: Verify and package
    if: github.repository == 'sandeepbist/Modesty' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      revision: ${{ steps.version.outputs.revision }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Execute reviewed main code; never execute code selected by tag input.
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Require configured maintainer approval
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/environments/release" > "$RUNNER_TEMP/release-environment.json"
          python3 - "$RUNNER_TEMP/release-environment.json" <<'PYTHON'
          import json, sys
          environment = json.load(open(sys.argv[1]))
          reviewers = [reviewer for rule in environment['protection_rules']
                       if rule['type'] == 'required_reviewers' for reviewer in rule['reviewers']]
          if not any(r['type'] == 'User' and r['reviewer']['login'] == 'sandeepbist' for r in reviewers):
              raise SystemExit('Configure the release environment with maintainer approval before dispatching.')
          if not (environment.get('deployment_branch_policy') or {}).get('protected_branches'):
              raise SystemExit('Restrict the release environment to protected branches before dispatching.')
          PYTHON
      - name: Check tag, main history and exact CI revision
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/release.py build --tag "$RELEASE_TAG" --verify-ci --output "$RUNNER_TEMP/release"
      - name: Identify release candidate
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          echo "revision=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_TAG" == *-rc.* ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: artifact
        with:
          name: release-package
          path: ${{ runner.temp }}/release/
          archive: true
          # Source archives are already compressed; store the transfer wrapper.
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Summarize candidate for maintainer review
        env:
          SOURCE_REVISION: ${{ steps.version.outputs.revision }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          {
            printf '### Release candidate\n\n'
            printf 'Source commit: `%s`\n\n' "$SOURCE_REVISION"
            printf '[Download candidate](%s)\n\n' "$ARTIFACT_URL"
            printf 'Transfer artifact SHA-256: `%s`\n\n' "$ARTIFACT_DIGEST"
            printf 'Inspect archives, release notes and SHA256SUMS before approving the release environment job.\n'
          } >> "$GITHUB_STEP_SUMMARY"
  draft:
    name: Create reviewed release draft
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    permissions:
      contents: write
    steps:
      # This job downloads data only; it never checks out or executes source.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: release-package
          skip-decompress: false
          digest-mismatch: error
      - name: Verify downloads and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ needs.package.outputs.prerelease }}
          RELEASE_REVISION: ${{ needs.package.outputs.revision }}
        run: |
          set -euo pipefail
          cd release-package
          sha256sum -c SHA256SUMS
          python3 - <<'PYTHON'
          import json, os, subprocess
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{os.environ["GH_REPO"]}/{path}'], text=True))
          obj = api(f'git/ref/tags/{os.environ["RELEASE_TAG"]}')['object']
          for _ in range(16):
              if obj['type'] != 'tag':
                  break
              obj = api(f'git/tags/{obj["sha"]}')['object']
          if obj['type'] != 'commit' or obj['sha'] != os.environ['RELEASE_REVISION']:
              raise SystemExit('Remote tag changed after packaging; release refused.')
          PYTHON
          args=(--draft --verify-tag --title "Modesty $RELEASE_TAG" --notes-file release-notes.md)
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          # Existing drafts/releases are never overwritten; inspect before retrying.
          gh release create "$RELEASE_TAG" Modesty-*.tar.gz Modesty-*.zip SHA256SUMS "${args[@]}"
