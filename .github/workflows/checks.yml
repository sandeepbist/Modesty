name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quick:
    name: Quick checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate source and release metadata
        run: |
          python3 tests/release.py --artifact-output "$RUNNER_TEMP/release-fixture"
          python3 scripts/release.py check
          python3 - <<'PYTHON'
          import ast, pathlib
          for path in pathlib.Path('.').rglob('*.py'):
              if '.git' not in path.parts:
                  ast.parse(path.read_text(), filename=str(path))
          PYTHON
          node tests/layout.cjs
          node tests/search.cjs
      - name: Validate Actions workflows
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
      # Exercise the same multi-file upload and exact-ID download as releases.
      # Keep verification inside a required job: a failed transfer must block PRs.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: artifact
        with:
          name: release-fixture
          path: ${{ runner.temp }}/release-fixture/
          archive: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.artifact.outputs.artifact-id }}
          path: ${{ runner.temp }}/downloaded-release-fixture
          skip-decompress: false
          digest-mismatch: error
      - name: Verify downloaded release package
        run: |
          (cd "$RUNNER_TEMP/downloaded-release-fixture" && sha256sum -c SHA256SUMS)
          python3 tests/release.py --artifact-input "$RUNNER_TEMP/downloaded-release-fixture"
  offline:
    name: Offline checks on Arch
    needs: quick
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run regression checks in an ephemeral Arch container
        # Namespace tests need bubblewrap. Fork code runs only on hosted runners.
        run: |
          cat > "$RUNNER_TEMP/modesty-arch-check.sh" <<'CHECK'
            set -euo pipefail
            pacman -Syu --noconfirm --needed git nodejs python dbus lua
            # Install the installer's actual required set so packaging omissions
            # fail here, before a user's first login. Optional AUR apps stay out.
            mapfile -t desktop_packages < <(python3 -c 'import install; print("\n".join(install.CORE))')
            pacman -S --noconfirm --needed "${desktop_packages[@]}"
            export XDG_RUNTIME_DIR=$(mktemp -d)
            # A Qt upgrade can precede the repository's Quickshell rebuild.
            # Check a minimal config, then rebuild the same stable package only
            # in this disposable runner. Never suppress the mismatch warning.
            printf 'import QtQuick\nimport Quickshell\nShellRoot { Timer { interval: 50; running: true; onTriggered: Qt.quit() } }\n' > /tmp/modesty-qt-probe.qml
            QT_QPA_PLATFORM=offscreen quickshell --no-color -p /tmp/modesty-qt-probe.qml > /tmp/modesty-qt-probe.log 2>&1
            if PYTHONPATH=scripts python3 -c 'import compatibility, pathlib, sys; sys.exit(0 if compatibility.qt_mismatch(pathlib.Path("/tmp/modesty-qt-probe.log").read_text()) else 1)'; then
              cat /tmp/modesty-qt-probe.log
              pacman -S --noconfirm --needed base-devel sudo cmake ninja
              useradd -m builder
              printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/modesty-builder
              chmod 440 /etc/sudoers.d/modesty-builder
              setpriv --reuid builder --regid builder --init-groups env HOME=/home/builder CMAKE_BUILD_PARALLEL_LEVEL=2 MAKEFLAGS=-j2 python3 -c 'import install; install.rebuild_quickshell({"quickshell"}, unattended=True)'
              QT_QPA_PLATFORM=offscreen quickshell --no-color -p /tmp/modesty-qt-probe.qml > /tmp/modesty-qt-probe.log 2>&1
              PYTHONPATH=scripts python3 -c 'import compatibility, pathlib; assert not compatibility.qt_mismatch(pathlib.Path("/tmp/modesty-qt-probe.log").read_text())'
            fi
            mkdir -p /run/dbus
            dbus-daemon --system --fork
            printf "[keyfile]\nunmanaged-devices=interface-name:*\n" > /tmp/modesty-ci-nm.conf
            NetworkManager --no-daemon --config /tmp/modesty-ci-nm.conf >/tmp/modesty-ci-nm.log 2>&1 &
            dbus-run-session -- bash -lc "pipewire >/tmp/modesty-ci-pipewire.log 2>&1 & python3 tests/check.py"
            # File-based enablement in this disposable container; no host units.
            systemctl enable NetworkManager bluetooth
            useradd -m desktopcheck
            cp -a /work /home/desktopcheck/Modesty
            chown -R desktopcheck:desktopcheck /home/desktopcheck/Modesty
            mkdir -p /tmp/modesty-desktop-runtime
            chown desktopcheck:desktopcheck /tmp/modesty-desktop-runtime
            chmod 700 /tmp/modesty-desktop-runtime
            setpriv --reuid desktopcheck --regid desktopcheck --init-groups env HOME=/home/desktopcheck XDG_RUNTIME_DIR=/tmp/modesty-desktop-runtime dbus-run-session -- bash -c 'cd /home/desktopcheck/Modesty; pipewire >/tmp/modesty-desktop-pipewire.log 2>&1 & python3 tests/installer-cli.py --isolated-home'
          CHECK
          docker run --rm --privileged -v "$PWD:/work" -v "$RUNNER_TEMP/modesty-arch-check.sh:/check.sh:ro" -w /work archlinux:base bash /check.sh
