include=@HOME@/.config/foot/modesty-generated.ini
shell=fish
title=foot
font=JetBrainsMono Nerd Font:size=12
font-bold=JetBrainsMono Nerd Font:style=SemiBold:size=12
line-height=22px
letter-spacing=0
dpi-aware=no
pad=24x20
bold-text-in-bright=no
gamma-correct-blending=no

[scrollback]
lines=10000

[cursor]
style=beam
beam-thickness=2px
blink=yes
blink-rate=650
unfocused-style=none

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=0.78
alpha-mode=matching
blur=yes

[colors-light]
alpha=0.78
alpha-mode=matching
blur=yes

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
search-start=Control+Shift+f

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G
